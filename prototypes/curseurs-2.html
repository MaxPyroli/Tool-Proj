<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prototype curseurs</title>
<style>
:root{--bg:#eef0f4;--ink:#1d2430;--card:#fffdf6;--line:#c9cfda}
@media(prefers-color-scheme:dark){:root{--bg:#161a20;--ink:#e8ecf2;--card:#262a31;--line:#3d4552}}
body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font:16px system-ui;display:grid;gap:18px;max-width:900px;margin:auto}
h1{font-size:1.2rem;margin:0}p{margin:0;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.zone{background:var(--card);border:1px solid var(--line);padding:16px;min-height:150px;display:grid;gap:10px;align-content:start}
.zone b{font-size:.95rem}.big{width:96px;height:96px}
.zone button,.zone .fake{font:inherit;padding:8px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
</style>
<h1>Curseurs de bureau</h1><p>Passe la souris sur chaque carte pour essayer (ordinateur seulement).</p>
<div class="grid" id="g"></div>
<script>
const INK="#1d2430";
const S={
 // flèche de papier : normale
 fleche:`<path d="M5 3v21l5.4-4.8 3.9 8.6 3.4-1.5-3.9-8.5h7.6z" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/><path d="M5 3v21l5.4-4.8 3.9 8.6 3.4-1.5-3.9-8.5h7.6z" fill="#fffdf6" stroke="${INK}" stroke-width="1.5" stroke-linejoin="round"/><path d="M5 3l10.5 10.6H9.3z" fill="#2f8f8a" opacity=".0"/>`,
 // punaise : sur ce qui se clique, la pointe est le point actif
 punaise:`<g transform="translate(12.5 19.5) rotate(45)" stroke-linejoin="round" stroke-linecap="round"><g stroke="#fff" stroke-width="4.5" fill="#fff"><ellipse cx="0" cy="-9" rx="5" ry="4"/><rect x="-6.5" y="-6" width="13" height="3.6"/><path d="M0 -2.4V12"/></g>
  <path d="M0 -2.4V12" stroke="#8d96a6" stroke-width="2.2"/><path d="M0 -2.4V12" stroke="${INK}" stroke-width="2.2" opacity=".0"/><rect x="-6.5" y="-6" width="13" height="3.6" fill="#e0544a" stroke="${INK}" stroke-width="1.3"/><ellipse cx="0" cy="-9" rx="5" ry="4" fill="#ee7268" stroke="${INK}" stroke-width="1.3"/><path d="M-2.4 -10.3q1.4-1.3 3-1" stroke="#fff" stroke-width="1.2" fill="none" opacity=".8"/></g>`,
 // tampon : autre idée pour ce qui se clique
 tampon:`<g stroke-linejoin="round"><g stroke="#fff" stroke-width="4.5" fill="#fff"><circle cx="16" cy="8" r="5.5"/><rect x="13.4" y="12" width="5.2" height="6"/><rect x="7" y="18" width="18" height="6" rx="1"/></g>
  <circle cx="16" cy="8" r="5.5" fill="#c9a56b" stroke="${INK}" stroke-width="1.4"/><rect x="13.4" y="12" width="5.2" height="6" fill="#a98649" stroke="${INK}" stroke-width="1.4"/><rect x="7" y="18" width="18" height="6" rx="1" fill="#2f8f8a" stroke="${INK}" stroke-width="1.4"/><path d="M7 27.5h18" stroke="${INK}" stroke-width="2" stroke-linecap="round"/></g>`,
 // trombone : on attrape
 trombone:`<g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 8v14a5.2 5.2 0 0 1-10.4 0V8a3.6 3.6 0 0 1 7.2 0v13a1.8 1.8 0 0 1-3.6 0V11" stroke="#fff" stroke-width="5.6"/><path d="M20.5 8v14a5.2 5.2 0 0 1-10.4 0V8a3.6 3.6 0 0 1 7.2 0v13a1.8 1.8 0 0 1-3.6 0V11" stroke="${INK}" stroke-width="3.8"/><path d="M20.5 8v14a5.2 5.2 0 0 1-10.4 0V8a3.6 3.6 0 0 1 7.2 0v13a1.8 1.8 0 0 1-3.6 0V11" stroke="#b9c0cc" stroke-width="1.8"/></g>`,
 // trombone qui pince un post-it : on tient quelque chose
 pince:`<g stroke-linejoin="round"><rect x="5" y="12" width="21" height="17" fill="#fff" stroke="#fff" stroke-width="4.5"/><rect x="5" y="12" width="21" height="17" fill="#f6d75b" stroke="${INK}" stroke-width="1.4"/><path d="M9 20h13M9 24h9" stroke="#c9a21f" stroke-width="1.2"/></g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 4v13a4.6 4.6 0 0 1-9.2 0V4.6a3.2 3.2 0 0 1 6.4 0V16a1.6 1.6 0 0 1-3.2 0V7" stroke="#fff" stroke-width="5.4"/><path d="M21.5 4v13a4.6 4.6 0 0 1-9.2 0V4.6a3.2 3.2 0 0 1 6.4 0V16a1.6 1.6 0 0 1-3.2 0V7" stroke="${INK}" stroke-width="3.6"/><path d="M21.5 4v13a4.6 4.6 0 0 1-9.2 0V4.6a3.2 3.2 0 0 1 6.4 0V16a1.6 1.6 0 0 1-3.2 0V7" stroke="#b9c0cc" stroke-width="1.6"/></g>`,
 // ciseaux : pour supprimer
 ciseaux:`<g stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M10.5 21 21.5 3M21.5 21 10.5 3" stroke="#fff" stroke-width="6.4"/><circle cx="9" cy="25" r="4.4" stroke="#fff" stroke-width="6"/><circle cx="23" cy="25" r="4.4" stroke="#fff" stroke-width="6"/>
  <path d="M10.5 21 21.5 3M21.5 21 10.5 3" stroke="${INK}" stroke-width="4.2"/><path d="M10.5 21 21.5 3M21.5 21 10.5 3" stroke="#cfd5df" stroke-width="2.2"/><circle cx="9" cy="25" r="4.4" stroke="${INK}" stroke-width="1.4" fill="#2f8f8a"/><circle cx="23" cy="25" r="4.4" stroke="${INK}" stroke-width="1.4" fill="#2f8f8a"/><circle cx="9" cy="25" r="1.8" fill="#eef0f4" stroke="none"/><circle cx="23" cy="25" r="1.8" fill="#eef0f4" stroke="none"/></g>`,
};
const hot={fleche:[5,3],punaise:[4,28],tampon:[16,27],trombone:[16,16],pince:[16,16],ciseaux:[16,14]};
const url=(k)=>`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">${S[k]}</svg>`)}") ${hot[k][0]} ${hot[k][1]}`;
const names={fleche:['Flèche de papier','le curseur normal'],punaise:['Punaise','sur les boutons et les liens (la pointe clique)'],tampon:['Tampon','autre idée pour les boutons et les liens'],trombone:['Trombone','sur un post-it ou le fond du mur (on peut attraper)'],pince:['Trombone + post-it','quand on tient un post-it'],ciseaux:['Ciseaux','sur « Supprimer » et la corbeille']};
const fb={fleche:'default',punaise:'pointer',tampon:'pointer',trombone:'grab',pince:'grabbing',ciseaux:'pointer'};
document.getElementById('g').innerHTML=Object.keys(S).map(k=>`<div class="zone" style="cursor:${url(k)},${fb[k]}"><b>${names[k][0]}</b><svg class="big" viewBox="0 0 32 32">${S[k]}</svg><p>${names[k][1]}</p></div>`).join('');
</script></html>
