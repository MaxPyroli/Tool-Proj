<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prototype curseurs</title>
<style>
:root{--bg:#eef0f4;--ink:#1d2430;--card:#fffdf6;--line:#c9cfda}
@media(prefers-color-scheme:dark){:root{--bg:#161a20;--ink:#e8ecf2;--card:#262a31;--line:#3d4552}}
body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font:16px system-ui;display:grid;gap:18px;max-width:900px;margin:auto}
h1{font-size:1.2rem;margin:0}p{margin:0;opacity:.75}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.zone{background:var(--card);border:1px solid var(--line);padding:16px;min-height:150px;display:grid;gap:10px;align-content:start}
.zone b{font-size:.95rem}.big{width:96px;height:96px}
.zone button,.zone .fake{font:inherit;padding:8px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
</style>
<h1>Curseurs de bureau</h1><p>Passe la souris sur chaque carte pour essayer (ordinateur seulement).</p>
<div class="grid" id="g"></div>
<script>
const halo=(d,extra='')=>`<g stroke-linejoin="round" stroke-linecap="round"><path d="${d}" fill="none" stroke="#fff" stroke-width="4.5" ${extra}/></g>`;
const S={
 // crayon : la pointe est le point actif
 pencil:`<g transform="translate(13.6 18.4) rotate(45)" stroke-linejoin="round"><g stroke="#fff" stroke-width="4.5" fill="#fff"><rect x="-3.2" y="-14" width="6.4" height="22"/><path d="M-3.2 8h6.4L0 15z"/><rect x="-3.2" y="-19" width="6.4" height="5"/></g>
  <rect x="-3.2" y="-14" width="6.4" height="22" fill="#f2c94c" stroke="#1d2430" stroke-width="1.3"/><path d="M-3.2 8h6.4L0 15z" fill="#e8c9a0" stroke="#1d2430" stroke-width="1.3"/><path d="M-1.2 12.4h2.4L0 15z" fill="#1d2430"/><rect x="-3.2" y="-14" width="6.4" height="2.6" fill="#b9c0cc" stroke="#1d2430" stroke-width="1.3"/><rect x="-3.2" y="-19" width="6.4" height="5" fill="#ef8f9c" stroke="#1d2430" stroke-width="1.3"/><path d="M-0.8 -11.4V8" stroke="#c99a1f" stroke-width="1"/></g>`,
 // main de papier kraft : l'index est le point actif
 hand:`<path d="M10.5 3.2a2.2 2.2 0 0 1 4.4 0V13l.6-.1v-1.3a2.1 2.1 0 0 1 4.2 0v1.8a2.1 2.1 0 0 1 4.2 0v2a2.1 2.1 0 0 1 4.2 0v7.6c0 3.6-2.6 6.4-6.2 6.4h-4.4c-2.6 0-4.4-1-5.8-2.8L5.6 20.4c-1.1-1.4.5-3.2 2-2.2L10.5 20z" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M10.5 3.2a2.2 2.2 0 0 1 4.4 0V13l.6-.1v-1.3a2.1 2.1 0 0 1 4.2 0v1.8a2.1 2.1 0 0 1 4.2 0v2a2.1 2.1 0 0 1 4.2 0v7.6c0 3.6-2.6 6.4-6.2 6.4h-4.4c-2.6 0-4.4-1-5.8-2.8L5.6 20.4c-1.1-1.4.5-3.2 2-2.2L10.5 20z" fill="#d9b678" stroke="#1d2430" stroke-width="1.4" stroke-linejoin="round"/><path d="M15.5 14.5v5M19.7 15.4v4M23.9 17v3" stroke="#a98649" stroke-width="1.2" stroke-linecap="round"/>`,
 // main ouverte
 grab:`<path d="M9 14V9.5a2 2 0 0 1 4 0V13h.5V6.5a2 2 0 0 1 4 0V13h.5V7.5a2 2 0 0 1 4 0V14h.5v-2.2a2 2 0 0 1 4 0V21c0 4.4-3.2 7.5-7.6 7.5h-1.6c-3 0-4.9-1.2-6.6-3.4L5 20.6c-.9-1.2.4-2.8 1.8-2z" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M9 14V9.5a2 2 0 0 1 4 0V13h.5V6.5a2 2 0 0 1 4 0V13h.5V7.5a2 2 0 0 1 4 0V14h.5v-2.2a2 2 0 0 1 4 0V21c0 4.4-3.2 7.5-7.6 7.5h-1.6c-3 0-4.9-1.2-6.6-3.4L5 20.6c-.9-1.2.4-2.8 1.8-2z" fill="#d9b678" stroke="#1d2430" stroke-width="1.4" stroke-linejoin="round"/>`,
 // main fermée
 grabbing:`<path d="M6.5 15.5a2.2 2.2 0 0 1 4.2-1 2.2 2.2 0 0 1 4-.2 2.2 2.2 0 0 1 4 .2 2.2 2.2 0 0 1 4 .8l.2 1.6c.5 2.2 1 3.6 1 5.4 0 4.2-3 6.6-7 6.6h-1.6c-3.6 0-5.4-1.6-6.8-4.2z" fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M6.5 15.5a2.2 2.2 0 0 1 4.2-1 2.2 2.2 0 0 1 4-.2 2.2 2.2 0 0 1 4 .2 2.2 2.2 0 0 1 4 .8l.2 1.6c.5 2.2 1 3.6 1 5.4 0 4.2-3 6.6-7 6.6h-1.6c-3.6 0-5.4-1.6-6.8-4.2z" fill="#d9b678" stroke="#1d2430" stroke-width="1.4" stroke-linejoin="round"/><path d="M10.7 14.5v4M14.7 14.3v4M18.8 14.5v4" stroke="#a98649" stroke-width="1.2" stroke-linecap="round"/>`,
 // gomme : pour tout ce qui efface ou supprime
 eraser:`<g transform="translate(16 17) rotate(-35)" stroke-linejoin="round"><rect x="-13" y="-7" width="26" height="14" rx="1" fill="#fff" stroke="#fff" stroke-width="4.5"/>
  <rect x="-13" y="-7" width="14" height="14" fill="#2f8f8a" stroke="#1d2430" stroke-width="1.4"/><rect x="1" y="-7" width="12" height="14" fill="#ef8f9c" stroke="#1d2430" stroke-width="1.4"/><path d="M-6 -7v14" stroke="#fff" stroke-width="1.2" opacity=".6"/></g>`,
};
const hot={pencil:[3,29],hand:[12,3],grab:[16,16],grabbing:[16,16],eraser:[6,24]};
const url=(k)=>`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">${S[k]}</svg>`)}") ${hot[k][0]} ${hot[k][1]}`;
const names={pencil:['Crayon','le curseur normal'],hand:['Main de papier','sur les boutons et les liens'],grab:['Main ouverte','sur un post-it ou le fond du mur (on peut attraper)'],grabbing:['Main fermée','quand on tient quelque chose'],eraser:['Gomme','sur « Supprimer » et la corbeille']};
const fb={pencil:'default',hand:'pointer',grab:'grab',grabbing:'grabbing',eraser:'pointer'};
document.getElementById('g').innerHTML=Object.keys(S).map(k=>`<div class="zone" style="cursor:${url(k)},${fb[k]}"><b>${names[k][0]}</b><svg class="big" viewBox="0 0 32 32">${S[k]}</svg><p>${names[k][1]}</p></div>`).join('');
</script></html>
