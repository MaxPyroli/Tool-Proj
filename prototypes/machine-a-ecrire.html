<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prototype chargement</title>
<style>
:root{--bg:#eef0f4;--ink:#1d2430;--paper:#fffdf6;--line:#b9c0cc;--teal:#2f8f8a;--tealD:#236f6b;--kraft:#c9a56b;--kraftD:#a98649;--key:#f6efe0;--keyD:#cfc3a8;--typed:#1d2430;--roll:#2a303b;--bail:#8d96a6;--edge:transparent}
@media(prefers-color-scheme:dark){:root{--bg:#161a20;--ink:#e8ecf2;--paper:#f6f1e4;--line:#9aa3b2;--teal:#4cc1ba;--tealD:#2f8f8a;--kraft:#d4b074;--kraftD:#a3834b;--key:#f6efdd;--keyD:#b9ae93;--typed:#1d2430;--roll:#5a6475;--bail:#b4bcca;--edge:rgba(255,255,255,.3)}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui}
.box{text-align:center}
svg{width:min(86vw,320px);height:auto;overflow:visible}
.cap{font:700 1.05rem ui-monospace,Menlo,Consolas,monospace;margin-top:6px;display:inline-flex;align-items:center}
.cap i{width:2px;height:1.1em;margin-left:2px;background:var(--teal);animation:b .5s steps(2) infinite}
@keyframes b{50%{opacity:0}}
.cover{transform-box:fill-box;transform-origin:right center;animation:rev 3.4s steps(13,end) infinite}
.caret{animation:cm 3.4s steps(13,end) infinite,b .5s steps(2) infinite}
@keyframes rev{0%{transform:scaleX(1)}75%,100%{transform:scaleX(0)}}
@keyframes cm{0%{transform:translateX(0)}75%,100%{transform:translateX(78px)}}
.k{animation:press .28s ease-in-out infinite}
@keyframes press{0%,14%,100%{transform:translateY(0)}6%{transform:translateY(3px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.ln{transform:none}}
</style>
<div class="box">
<svg viewBox="0 0 220 175" role="img" aria-label="Chargement">
 <!-- bout de papier qui sort -->
 <rect x="62" y="38" width="96" height="50" fill="var(--paper)" stroke="var(--line)"/>
 <text x="70" y="62" font-family="ui-monospace,Menlo,Consolas,monospace" font-weight="700" font-size="10.5" fill="var(--typed)">Chargement...</text>
 <rect class="cover" x="68" y="49" width="86" height="19" fill="var(--paper)"/>
 <rect class="caret" x="69" y="51" width="1.6" height="14" fill="var(--teal)"/>
 <!-- barre de maintien -->
 <rect x="58" y="72" width="104" height="2.4" fill="var(--bail)"/>
 <!-- rouleau + molettes -->
 <rect x="52" y="80" width="116" height="13" rx="6.5" fill="var(--roll)" stroke="var(--edge)"/>
 <rect x="52" y="83" width="116" height="2" fill="#fff" opacity=".12"/>
 <g fill="var(--kraft)" stroke="var(--kraftD)" stroke-width="1.5"><circle cx="46" cy="86.5" r="7"/><circle cx="174" cy="86.5" r="7"/></g>
 <g fill="var(--kraftD)"><circle cx="46" cy="86.5" r="2.5"/><circle cx="174" cy="86.5" r="2.5"/></g>
 <!-- corps -->
 <path d="M32 175 L44 108 Q46 96 58 96 L162 96 Q174 96 176 108 L188 175 Z" fill="var(--teal)" stroke="var(--edge)" stroke-width="1.5"/>
 <path d="M44 108 Q46 96 58 96 L162 96 Q174 96 176 108 L178 122 L42 122 Z" fill="var(--tealD)"/>
 <rect x="82" y="104" width="56" height="7" fill="var(--kraft)"/>
 <g fill="var(--kraftD)"><circle cx="64" cy="109" r="5"/><circle cx="156" cy="109" r="5"/></g>
 <g fill="var(--paper)"><circle cx="64" cy="109" r="1.6"/><circle cx="156" cy="109" r="1.6"/></g>
 <!-- touches -->
 <g fill="var(--key)" stroke="var(--keyD)" stroke-width="1.5">
  <g><circle class="k" style="animation-duration:1.13s;animation-delay:0.2s" cx="70" cy="136" r="7.5"/><circle class="k" style="animation-duration:1.71s;animation-delay:1.1s" cx="90" cy="136" r="7.5"/><circle class="k" style="animation-duration:0.97s;animation-delay:0.6s" cx="110" cy="136" r="7.5"/><circle class="k" style="animation-duration:2.3s;animation-delay:0.05s" cx="130" cy="136" r="7.5"/><circle class="k" style="animation-duration:1.49s;animation-delay:1.7s" cx="150" cy="136" r="7.5"/></g>
  <g><circle class="k" style="animation-duration:1.87s;animation-delay:0.9s" cx="60" cy="155" r="7.5"/><circle class="k" style="animation-duration:0.83s;animation-delay:1.3s" cx="80" cy="155" r="7.5"/><circle class="k" style="animation-duration:2.05s;animation-delay:0.4s" cx="100" cy="155" r="7.5"/><circle class="k" style="animation-duration:1.31s;animation-delay:1.9s" cx="120" cy="155" r="7.5"/><circle class="k" style="animation-duration:1.63s;animation-delay:0.75s" cx="140" cy="155" r="7.5"/><circle class="k" style="animation-duration:2.6s;animation-delay:1.45s" cx="160" cy="155" r="7.5"/></g>
 </g>
 <rect x="82" y="168" width="56" height="5" rx="2.5" fill="var(--key)" stroke="var(--keyD)" stroke-width="1.2"/>
</svg>

</div></html>
