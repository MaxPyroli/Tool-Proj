name: Déployer sur GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Déploie uniquement la branche par défaut du dépôt.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Écrire config.js depuis les variables du dépôt
        if: vars.SUPABASE_URL != ''
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
          ALLOW_SIGNUP: ${{ vars.ALLOW_SIGNUP || 'true' }}
        run: |
          node -e '
            const c = { supabaseUrl: process.env.SUPABASE_URL, supabaseKey: process.env.SUPABASE_KEY, allowSignup: process.env.ALLOW_SIGNUP !== "false" };
            require("fs").writeFileSync("public/config.js", "window.TOOL_PROJ_CONFIG = " + JSON.stringify(c, null, 2) + ";\n");
          '

      - name: Numéroter le build
        run: |
          sed -i "s/const APP_BUILD = 'dev';/const APP_BUILD = '${{ github.run_number }}';/" public/app.js
          sed -i "s/const BUILD = 'dev';/const BUILD = '${{ github.run_number }}';/" public/sw.js
          grep -q "APP_BUILD = '${{ github.run_number }}'" public/app.js
          grep -q "BUILD = '${{ github.run_number }}'" public/sw.js

      - name: Assembler le site (app normale + copie bêta dans /beta/)
        run: |
          mkdir -p _site/beta
          cp -r public/. _site/
          cp -r public/. _site/beta/
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("_site/beta/manifest.webmanifest", "utf8"));
            m.name = "Tool Proj Bêta"; m.short_name = "Tool Proj β"; m.theme_color = "#b45309";
            fs.writeFileSync("_site/beta/manifest.webmanifest", JSON.stringify(m, null, 2));
            const h = fs.readFileSync("_site/beta/index.html", "utf8").replace(/<title>[^<]*<\/title>/, "<title>Tool Proj Bêta</title>");
            fs.writeFileSync("_site/beta/index.html", h);
          '
          test -f _site/beta/app.js && test -f _site/app.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
